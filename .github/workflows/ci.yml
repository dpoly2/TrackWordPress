name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHPUnit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install dependencies
        working-directory: xftc-redevelopment/plugin/ts-membership
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        working-directory: xftc-redevelopment/plugin/ts-membership
        run: vendor/bin/phpunit
